<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SFX прослушка</title>
<style>
  :root {
    --bg: #0f1012; --panel: #17181b; --card: #1c1d21; --card-hi: #23252a; --line: #2a2c31;
    --text: #e8e8ea; --muted: #8b8d94; --dim: #5d5f66; --accent: #7aa2ff; --star: #f5c451;
    --wave: #6f7685; --wave-hi: #a9b8ff; --danger: #ff6b6b; --danger-bg: #2a1416; --ok: #6bd49a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(15,16,18,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 16px; padding: 12px 20px; flex-wrap: wrap; }
  h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  .stamp { color: var(--dim); font-size: 11px; }
  .spacer { flex: 1; }
  label.chk { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; user-select: none; }
  button { font: inherit; color: var(--text); background: var(--card-hi); border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; cursor: pointer; }
  button:hover { border-color: #3a3d44; }
  button.primary { background: var(--accent); color: #0b0d12; border-color: transparent; font-weight: 600; }
  button.primary:disabled { background: var(--card-hi); color: var(--dim); cursor: default; }
  .status { font-size: 12px; color: var(--muted); min-width: 140px; text-align: right; }
  .status.dirty { color: var(--star); } .status.ok { color: var(--ok); } .status.err { color: var(--danger); }
  nav.tabs { display: flex; gap: 2px; padding: 0 16px; overflow-x: auto; }
  nav.tabs button { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 10px; color: var(--muted); white-space: nowrap; }
  nav.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  nav.tabs .n { color: var(--dim); margin-left: 4px; font-variant-numeric: tabular-nums; }
  nav.tabs .s { color: var(--star); margin-left: 3px; }
  main { padding: 16px 20px 60px; }
  .alert { background: var(--danger-bg); border: 1px solid #5a2328; color: #ffd4d4; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .alert b { color: var(--danger); }
  .alert ul { margin: 6px 0 0; padding-left: 18px; }
  .alert li { margin: 2px 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .alert button { margin-left: 8px; padding: 1px 7px; font-size: 11px; }
  .hint { color: var(--dim); font-size: 11px; margin-bottom: 12px; }
  kbd { font: 11px ui-monospace, Menlo, monospace; background: var(--card-hi); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; outline: none; }
  .card.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .card.starred { background: #201f1a; }
  .top { display: flex; align-items: center; gap: 8px; }
  .play { width: 30px; height: 30px; border-radius: 50%; padding: 0; display: grid; place-items: center; flex: none; }
  .play svg { width: 12px; height: 12px; fill: currentColor; }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .star { background: none; border: none; font-size: 18px; line-height: 1; padding: 2px 4px; color: var(--dim); }
  .star.on { color: var(--star); }
  canvas { width: 100%; height: 44px; display: block; background: #141518; border-radius: 6px; cursor: pointer; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .meta span b { color: var(--text); font-weight: 500; }
  .tag { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .tag.lic { color: var(--ok); border-color: #22402f; }
  .tag.conf-none { color: var(--dim); }
  .row { display: flex; gap: 6px; }
  .row button { padding: 3px 8px; font-size: 12px; }
  .note { flex: 1; min-width: 0; background: #141518; border: 1px solid var(--line); border-radius: 6px; color: var(--text); font: inherit; font-size: 12px; padding: 3px 7px; }
  .note:disabled { opacity: .35; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>SFX прослушка</h1>
    <span class="stamp" id="stamp"></span>
    <span class="spacer"></span>
    <label class="chk"><input type="checkbox" id="onlyStarred"> только отмеченные</label>
    <span class="status" id="status"></span>
    <button class="primary" id="save" disabled>Сохранить отбор</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main>
  <div id="alerts"></div>
  <div class="hint">
    <kbd>пробел</kbd> играть текущий · <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> навигация ·
    <kbd>R</kbd> серия (4× через 80 мс, ±1 полутон) · <kbd>S</kbd> ★ в эталон · <kbd>[</kbd><kbd>]</kbd> соседний таб
  </div>
  <div class="grid" id="grid"></div>
</main>
<script>
'use strict';
const TYPES = ['click', 'toggle', 'pop', 'whoosh', 'keystroke', 'tick', 'notify', 'success', 'error', 'other'];
const $ = (s) => document.querySelector(s);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); for (const k of kids) if (k != null) e.append(k); return e; };

const state = {
  manifest: null,
  byId: new Map(),         // id → sound
  picks: new Map(),        // id → {type, sha256, note}  — текущий отбор (★)
  orphans: [],             // записи approved.json без совпадения id+sha256 в манифесте: [{type,id,sha256,note,reason}]
  tab: 'click', onlyStarred: false, cur: 0, dirty: false, list: [],
};

// ---------- аудио ----------
let ctx = null;
const audioCtx = () => (ctx ||= new AudioContext());
const buffers = new Map(); // file → Promise<AudioBuffer>
function loadBuffer(file) {
  if (!buffers.has(file)) buffers.set(file, fetch('/' + file).then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then((ab) => audioCtx().decodeAudioData(ab)));
  return buffers.get(file);
}
function playBuffer(buf, when = 0, semitones = 0, gainDb = 0) {
  const c = audioCtx();
  const src = c.createBufferSource(); src.buffer = buf; src.playbackRate.value = 2 ** (semitones / 12);
  const g = c.createGain(); g.gain.value = 10 ** (gainDb / 20);
  src.connect(g).connect(c.destination); src.start(c.currentTime + when);
}
async function play(s) { const b = await loadBuffer(s.file); await audioCtx().resume(); playBuffer(b); }
// «Серия»: 4 раза с интервалом 80 мс, разброс ±1 полутон и −0…−4 dB — как звук ведёт себя в «лесенке» анимации.
// Детерминированный PRNG (mulberry32), seed от id — одна и та же серия при повторе.
function prng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
async function series(s) {
  const b = await loadBuffer(s.file); await audioCtx().resume();
  let h = 0; for (const ch of s.id) h = (h * 31 + ch.charCodeAt(0)) | 0;
  const rnd = prng(h);
  for (let i = 0; i < 4; i++) playBuffer(b, i * 0.08, rnd() * 2 - 1, -rnd() * 4);
}

// ---------- волна ----------
async function drawWave(canvas, s) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth * dpr, h = canvas.clientHeight * dpr;
  canvas.width = w; canvas.height = h;
  const g = canvas.getContext('2d');
  let buf;
  try { buf = await loadBuffer(s.file); } catch { g.fillStyle = '#ff6b6b'; g.font = `${11 * dpr}px sans-serif`; g.fillText('не загрузился', 6 * dpr, h / 2); return; }
  const data = buf.getChannelData(0); const data2 = buf.numberOfChannels > 1 ? buf.getChannelData(1) : null;
  const step = data.length / w; const mid = h / 2;
  g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--wave');
  for (let x = 0; x < w; x++) {
    let mn = 0, mx = 0; const a = Math.floor(x * step), z = Math.max(a + 1, Math.floor((x + 1) * step));
    for (let i = a; i < z && i < data.length; i++) { const v = data2 ? (data[i] + data2[i]) / 2 : data[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
    g.fillRect(x, mid - mx * mid * 0.95, 1, Math.max(1, (mx - mn) * mid * 0.95));
  }
  // маркер транзиента (момент максимальной огибающей)
  const tx = (s.transientMs / 1000) * buf.sampleRate / step;
  g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--wave-hi');
  g.fillRect(Math.round(tx), 0, Math.max(1, dpr), h);
}
const waveObserver = new IntersectionObserver((entries) => {
  for (const e of entries) if (e.isIntersecting) { waveObserver.unobserve(e.target); drawWave(e.target, state.byId.get(e.target.dataset.id)); }
}, { rootMargin: '200px' });

// ---------- данные ----------
async function load() {
  const m = await fetch('/manifest.json').then((r) => { if (!r.ok) throw new Error('manifest.json: ' + r.status); return r.json(); });
  state.manifest = m;
  for (const s of m.sounds) state.byId.set(s.id, s);
  $('#stamp').textContent = `${m.sounds.length} звуков · collector ${m.collectorVersion} · ${new Date(m.generatedAt).toLocaleString('ru')}`;
  let ap = { approved: {} };
  const r = await fetch('/approved.json');
  if (r.ok) ap = await r.json(); else if (r.status !== 404) throw new Error('approved.json: ' + r.status);
  // Сверка approved ↔ manifest по id+sha256. Ненайденные не выбрасываем молча: они остаются в отборе, пока человек не уберёт их.
  for (const [type, list] of Object.entries(ap.approved || {})) {
    for (const e of list || []) {
      const s = state.byId.get(e.id);
      if (s && s.sha256 === e.sha256) state.picks.set(e.id, { type: s.type, sha256: s.sha256, note: e.note || '' });
      else state.orphans.push({ type, id: e.id, sha256: e.sha256, note: e.note || '', reason: s ? 'sha256 изменился' : 'нет в манифесте' });
    }
  }
}

// ---------- UI ----------
function setStatus(text, cls = '') { const s = $('#status'); s.textContent = text; s.className = 'status ' + cls; }
function markDirty() { state.dirty = true; $('#save').disabled = false; setStatus('есть несохранённые изменения', 'dirty'); }

function renderAlerts() {
  const box = $('#alerts'); box.replaceChildren();
  if (!state.orphans.length) return;
  const ul = el('ul');
  state.orphans.forEach((o, i) => {
    const rm = el('button', { textContent: 'убрать из отбора', onclick: () => { state.orphans.splice(i, 1); renderAlerts(); markDirty(); } });
    ul.append(el('li', {}, `${o.type} / ${o.id} — ${o.reason} (sha ${o.sha256.slice(0, 10)}…)`, rm));
  });
  box.append(el('div', { className: 'alert' },
    el('b', { textContent: `В approved.json ${state.orphans.length} записей не найдено в manifest.json (id+sha256).` }),
    el('div', { textContent: 'Они сохраняются в отборе как есть, пока вы не уберёте их явно.' }), ul));
}

function renderTabs() {
  const nav = $('#tabs'); nav.replaceChildren();
  for (const t of TYPES) {
    const n = state.manifest.sounds.filter((s) => s.type === t).length;
    const st = [...state.picks.values()].filter((p) => p.type === t).length;
    nav.append(el('button', { className: t === state.tab ? 'on' : '', onclick: () => { state.tab = t; state.cur = 0; render(); } },
      t, el('span', { className: 'n', textContent: n }), st ? el('span', { className: 's', textContent: '★' + st }) : null));
  }
}

const PLAY_SVG = '<svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg>';
function card(s, idx) {
  const pick = state.picks.get(s.id);
  const c = el('div', { className: 'card' + (pick ? ' starred' : '') + (idx === state.cur ? ' cur' : ''), tabIndex: -1 });
  c.dataset.idx = idx;
  const playBtn = el('button', { className: 'play', title: 'играть (пробел)', innerHTML: PLAY_SVG, onclick: () => { select(idx); play(s); } });
  const star = el('button', { className: 'star' + (pick ? ' on' : ''), textContent: '★', title: 'в эталон (S)', onclick: () => { select(idx); toggleStar(s); } });
  const cv = el('canvas'); cv.dataset.id = s.id; cv.onclick = () => { select(idx); play(s); };
  const note = el('input', { className: 'note', placeholder: pick ? 'заметка…' : 'отметьте ★, чтобы добавить заметку', value: pick?.note || '', disabled: !pick });
  note.oninput = () => { const p = state.picks.get(s.id); if (p) { p.note = note.value; markDirty(); } };
  note.onkeydown = (e) => e.stopPropagation();
  c.append(
    el('div', { className: 'top' }, playBtn, el('div', { className: 'name', title: s.id, textContent: s.id.split('__')[1] }), star),
    cv,
    el('div', { className: 'meta' },
      el('span', {}, el('b', { textContent: Math.round(s.durationMs) }), ' мс'),
      el('span', {}, el('b', { textContent: s.lufs ?? '—' }), ' LUFS'),
      el('span', {}, 'транз. ', el('b', { textContent: s.transientMs }), ' мс'),
      el('span', { className: 'tag' }, s.source),
      el('span', { className: 'tag lic' }, s.license),
      el('span', { className: 'tag conf-' + s.typeConfidence, title: 'уверенность классификации' }, s.typeConfidence)),
    el('div', { className: 'row' }, el('button', { textContent: '▶▶▶▶ серия', title: '4× через 80 мс, ±1 полутон (R)', onclick: () => { select(idx); series(s); } }), note));
  waveObserver.observe(cv);
  return c;
}

function render() {
  renderTabs();
  state.list = state.manifest.sounds.filter((s) => s.type === state.tab && (!state.onlyStarred || state.picks.has(s.id)));
  if (state.cur >= state.list.length) state.cur = Math.max(0, state.list.length - 1);
  const grid = $('#grid'); grid.replaceChildren();
  if (!state.list.length) { grid.append(el('div', { className: 'empty', textContent: state.onlyStarred ? 'Нет отмеченных в этом типе.' : 'В этом типе пока нет звуков.' })); return; }
  state.list.forEach((s, i) => grid.append(card(s, i)));
}

function select(idx) {
  const cards = document.querySelectorAll('.card');
  cards[state.cur]?.classList.remove('cur');
  state.cur = Math.max(0, Math.min(state.list.length - 1, idx));
  const c = cards[state.cur]; if (c) { c.classList.add('cur'); c.scrollIntoView({ block: 'nearest' }); }
}

function toggleStar(s) {
  if (state.picks.has(s.id)) state.picks.delete(s.id); else state.picks.set(s.id, { type: s.type, sha256: s.sha256, note: '' });
  markDirty();
  const keep = state.cur; render(); select(keep);
}

async function save() {
  const approved = {};
  for (const [id, p] of state.picks) (approved[p.type] ||= []).push({ id, sha256: p.sha256, note: p.note });
  for (const o of state.orphans) (approved[o.type] ||= []).push({ id: o.id, sha256: o.sha256, note: o.note });
  for (const t of Object.keys(approved)) approved[t].sort((a, b) => a.id.localeCompare(b.id));
  $('#save').disabled = true; setStatus('сохраняю…');
  try {
    const r = await fetch('/api/approved', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ approved }) });
    const txt = await r.text();
    if (!r.ok) throw new Error(txt);
    const res = JSON.parse(txt);
    state.dirty = false;
    setStatus(`сохранено: ${res.count}${res.backup ? ' · бэкап сделан' : ''}`, 'ok');
  } catch (e) { $('#save').disabled = false; setStatus('ошибка сохранения: ' + e.message, 'err'); }
}

function columns() {
  const cards = document.querySelectorAll('.card'); if (cards.length < 2) return 1;
  const top = cards[0].offsetTop; let n = 0; for (const c of cards) { if (c.offsetTop !== top) break; n++; } return n;
}

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === 'INPUT') return;
  const s = state.list[state.cur];
  switch (e.key) {
    case ' ': e.preventDefault(); if (s) play(s); break;
    case 'ArrowRight': e.preventDefault(); select(state.cur + 1); break;
    case 'ArrowLeft': e.preventDefault(); select(state.cur - 1); break;
    case 'ArrowDown': e.preventDefault(); select(state.cur + columns()); break;
    case 'ArrowUp': e.preventDefault(); select(state.cur - columns()); break;
    case 'r': case 'R': case 'к': case 'К': if (s) series(s); break;
    case 's': case 'S': case 'ы': case 'Ы': if (s) toggleStar(s); break;
    case '[': case ']': { const i = TYPES.indexOf(state.tab) + (e.key === ']' ? 1 : -1); state.tab = TYPES[(i + TYPES.length) % TYPES.length]; state.cur = 0; render(); break; }
  }
});
window.addEventListener('beforeunload', (e) => { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });
$('#onlyStarred').onchange = (e) => { state.onlyStarred = e.target.checked; state.cur = 0; render(); };
$('#save').onclick = save;

load().then(() => {
  const firstNonEmpty = TYPES.find((t) => state.manifest.sounds.some((s) => s.type === t));
  if (firstNonEmpty) state.tab = firstNonEmpty;
  renderAlerts(); render();
}).catch((e) => { $('#alerts').append(el('div', { className: 'alert' }, el('b', { textContent: 'Ошибка загрузки: ' }), e.message, el('div', { textContent: 'Запустите node sfx/collect.mjs и перезапустите сервер.' }))); });
</script>
</body>
</html>
