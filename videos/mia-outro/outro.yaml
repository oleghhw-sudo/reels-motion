# Аутро MIA — данные по сериям. НЕВОССТАНОВИМОЕ (гейт 5): правят Олег / архитектор, скрипты НЕ перезаписывают.
# Источники: MIA_SHORT_DIR (env.manifest) → _outro-analysis/src/V1..V12 (ссылки на исходники; V11/V12 — офицер, добавлены 2026-10-18), shots.json (запретные зоны).
# Кадры (frame) — номера кадров исходника при его fps (24). Время — секунды.
# Решения Олега: 2026-10-17/18 (задача 008). Кандидаты: отчёт Claude Code сессии MIA, 2026-10-18.

music:
  file: "Midnight Pursuit.wav"     # относительно MIA_SHORT_DIR
  from: 42.379                     # 9 ударов: предразгон 2 доли + погоня + 4 героя + заряд + затишье + финал («всё да» Олега 2026-10-18)
  to: 60.720                       # естественный обрыв трека, без fade; после него держим финальный кадр holdAfter
  holdAfter: 1.25                  # тишина с финальным текстом после обрыва (readcheck финальной строки)
  bpm: 130.81                      # доля 0.4587 с = 11 кадров
  hits: [0.917, 2.752, 4.597, 6.432, 8.277, 10.112, 11.946, 13.781, 15.616]   # от начала отрезка; ПРОВЕРИТЬ НА СЛУХ: _outro-analysis/music/D_preroll_9hits_CLICKS.wav
  listen: "_outro-analysis/music/D_preroll_9hits_42.379-60.720.wav"
  license: "Suno — тариф уточнить (некоммерческое использование ок; предупреждение по гейту 6)"

format:
  landscape: {w: 1920, h: 1080}
  portrait:  {w: 1080, h: 1920}
  fps: 24

names:          # рабочие DARK/BLOND/OFFICER → имена в кадре (решение Олега 2026-10-18)
  DARK: ROOK
  BLOND: JAX
  OFFICER: HALE

card:           # карточка героя: стоп-кадр → вырезанная фигура на поп-арт фоне (решение Олега 2026-10-18 «да»)
  cutouts: "_outro-analysis/cards/"      # PNG с альфой, сделаны архитектором (rembg isnet), относительно MIA_SHORT_DIR
  concept: "_outro-analysis/cards/MIA_cards_concept_v2.jpg"   # эталон вида; скрипт наброска card_concept.py
  outline: {white: 14, black: 22, shadow: [18, 18]}   # px при 1080p; обводка по сглаженному силуэту (тонкие пряди поверх, без обводки)
  bg: {halftone: true, rays: 18}
  font: {name: Anton, tagline: Oswald}   # оба — в public/fonts с проверкой глифов (CLAUDE.md «Шрифты»)

episodes:
  ep01:
    # Каждый пункт начинается на доле; `on: hN` — на ударе N из music.hits; `beats` — длительность в долях.
    timeline:
      # Каждый пункт начинается на доле; `on: hN` — удар N из music.hits; `beats` — длительность в долях; `in` — приём входа (см. fx).
      - {kind: live, src: V7,  from: 24,  to: 45,  on: start, beats: 2, note: "погоня: Subaru и BMW на трассе"}
      - {kind: live, src: V1,  from: 180, to: 201, on: h1, beats: 2, in: whip, note: "капот Subaru, MIA за стеклом, BMW сзади"}
      - {kind: live, src: V3,  from: 228, to: 260, beats: 2, in: whip, ramp: true, note: "машина переворачивается в воздухе; 33 исх. кадра в 22 вых. — speed ramp в замедление к удару"}
      - {kind: card, hero: MIA,   cutout: MIA_V5_f24_cut.png,    title: MIA,  tagline: "The Inventor",     bg: "#D62828", side: left,  on: h2, beats: 3}
      - {kind: live, src: V10, from: 97,  to: 108, beats: 1, in: whip, note: "ROOK смотрит на MIA (V10-02)"}
      - {kind: live, src: V10, from: 150, to: 193, on: h3, beats: 4, in: whip, ramp: true, note: "ROOK наводит пистолет на MIA; склейка ровно на удар; ramp + наезд к удару (как в прототипе)"}
      - {kind: card, hero: DARK,  cutout: DARK_new2_cut.png, title: ROOK, tagline: "The Hunter",       bg: "#F7C600", side: left,  on: h4, beats: 3, note: "кадр 2 Олега (прямой взгляд в камеру, src: cards/src/DARK_new2.jpg — отдельная картинка, не из видео); f221 отклонён 2026-10-18 — читается как удивление, удивление только у JAX. Подчистить: кусок руки MIA у правого края вырезки"}
      - {kind: live, src: V9,  from: 157, to: 168, beats: 1, in: whip, ramp: true}
      - {kind: card, hero: BLOND, cutout: BLOND_V9_f168_cut.png, title: JAX,  tagline: "Friend or enemy?", bg: "#00AAC8", side: right, on: h5, beats: 3}
      - {kind: live, src: V12, from: 1,   to: 12,  beats: 1, in: whip, ramp: true, note: "HALE профиль с гарнитурой"}
      - {kind: card, hero: OFFICER, cutout: OFF_V12_f12_cut.png, title: HALE, tagline: "The Law",          bg: "#1E1E1E", tagColor: "#F7C600", side: right, on: h6, beats: 4}
      - {kind: live, src: V12, from: 317, to: 360, on: h7, beats: 4, in: whip, note: "заряд на двери, мигает красный огонёк; медленный наезд на огонёк"}
      - {kind: lull, src: V5,  from: 239, on: h8, beats: 4, push: 0.04, note: "закрытая железная дверь ангара; к концу — лёгкая вибрация кадра (предчувствие взрыва)"}
      - {kind: final, src: V5, on: h9, flash: true, title: MIA, line: "She built the future. They came to take it.", tail: "To be continued", note: "удар = взрыв: 3 белых кадра, сильная тряска, MIA влетает как имя на карточке; строка и tail крупнее; после обрыва музыки — holdAfter"}
    vertical:
      crops: {V7: B, V1: B, V3: A, V10_look: A, V10_gun: B, V9: A, V12_profile: A, V12_charge: C, V5_lull: C, V5_final: C}   # по листу MiaOutroVertical-crops.png (рекомендация архитектора, «всё да» Олега); для V7/V1/V3 вариантов ещё нет — билдер делает 3 варианта, по умолчанию B (центр действия), выбор Олега по листу
      cards: "фигура снизу, имя сверху; растворение верха фигуры 120 px"
    sfx:                       # v3 «звуковой бюджет» (Олег «да» 2026-10-19, задача 018): ≤ 2 слоя на ударе, свист не на каждой склейке, начало — одна музыка. Внешние звуки — лицензия unknown → licenseWarning (гейт 6); замена на CC0 перед публикацией в Instagram
      whip: {dir: "sfx/raw/external/whoosh", pick: [need-02, hook-03, epic3-03], on: ["V3:228", "V10:150", "V12:317"], note: "только на 3 смаз-склейках из 7 (переворот, наводка, заряд); остальные смазы — без свиста"}
      riser: {dir: "sfx/raw/external/riser", pick: [epic4-04, epic4-06, epic3-08], heroes: [DARK, OFFICER], note: "только перед ROOK и HALE, конец = удар карточки; MIA и JAX входят чистым ударом"}
      impact: {dir: "sfx/raw/external/boom", pick: [epic3-04, epic3-05, epic4-03], note: "на ударе карточки, пик по transientMs"}
      slam: {dir: "sfx/raw/external/impact", pick: [need-10, need-06], note: "на посадке имени (удар +3 кадра)"}
      # card (щелчок затвора remotion__shutter-modern) убран в v3 — третий слой на ударе карточки
      final: {dir: "sfx/raw/external/boom", pick: [epic4-08], note: "взрыв на финальном ударе поверх музыки"}
      gainVsMusic: 0.5           # v3 не меняет; решать на слух после A/B
      note: "конкретный файл из pick — по слуху/замерам билдера; ничего из sfx/raw в git. v2 (до 2026-10-19): свист на всех 7 смазах, riser на всех 4 карточках, щелчок — 4 слоя на ударе"

forbidden:   # дублирует shots.json для проверки сборки; источник правды — shots.json
  - {src: V8,  from: 0,     to: end,    reason: spoiler-flashback}
  - {src: V9,  from: 12.25, to: end,    reason: spoiler-flashback}
  - {src: V10, from: 0,     to: 2.33,   reason: "morph + spoiler-flashback"}
  - {src: V10, from: 8.13,  to: 9.458,  reason: "spoiler-flashback — только кроп без BLOND"}
  - {src: V10, from: 9.458, to: end,    reason: spoiler}
  - {src: V12, from: 3.0,   to: 8.5,    reason: "вшитый титр MIA'S STORY — a short film"}
