# ПРЕДЛОЖЕНИЕ v4 (архитектор, задача 030, 2026-11-06) — копия outro.yaml, изменены только приёмы. outro.yaml (v3) не тронут (гейт 5).
# Выбор Олега 2026-11-06: пакет П2 «чистый звук + живое отображение»; стоп-кадр героя — «Досье / скан» вместо поп-арта;
# звук — каждое событие обосновано (видимое действие, место под музыкой, не перекрывает следующее). Утверждает Олег по стоп-кадрам и A/B.
# Поля, которых нет в схеме v3 (src/videos/mia-outro/script.ts), помечены «NEW v4» — билдер добавляет поле + читатель вместе (гейт 3).
# Аутро MIA — данные по сериям. НЕВОССТАНОВИМОЕ (гейт 5): правят Олег / архитектор, скрипты НЕ перезаписывают.
# Источники: MIA_SHORT_DIR (env.manifest) → _outro-analysis/src/V1..V12 (ссылки на исходники; V11/V12 — офицер, добавлены 2026-10-18), shots.json (запретные зоны).
# Кадры (frame) — номера кадров исходника при его fps (24). Время — секунды.
# Решения Олега: 2026-10-17/18 (задача 008). Кандидаты: отчёт Claude Code сессии MIA, 2026-10-18.

music:
  file: "Midnight Pursuit.wav"     # относительно MIA_SHORT_DIR
  from: 42.379                     # 9 ударов: предразгон 2 доли + погоня + 4 героя + заряд + затишье + финал («всё да» Олега 2026-10-18)
  to: 60.720                       # естественный обрыв трека, без fade; после него держим финальный кадр holdAfter
  holdAfter: 1.25                  # тишина с финальным текстом после обрыва (readcheck финальной строки)
  bpm: 130.81                      # доля 0.4587 с = 11 кадров
  hits: [0.917, 2.752, 4.597, 6.432, 8.277, 10.112, 11.946, 13.781, 15.616]   # от начала отрезка; ПРОВЕРИТЬ НА СЛУХ: _outro-analysis/music/D_preroll_9hits_CLICKS.wav
  listen: "_outro-analysis/music/D_preroll_9hits_42.379-60.720.wav"
  license: "Suno — тариф уточнить (некоммерческое использование ок; предупреждение по гейту 6)"

format:
  landscape: {w: 1920, h: 1080}
  portrait:  {w: 1080, h: 1920}
  fps: 24

names:          # рабочие DARK/BLOND/OFFICER → имена в кадре (решение Олега 2026-10-18)
  DARK: ROOK
  BLOND: JAX
  OFFICER: HALE

card:           # NEW v4: стоп-кадр героя «Досье / скан» (выбор Олега 2026-11-06) вместо поп-арта v3. Вырезки те же.
  style: dossier                         # NEW v4 (v3: popart)
  cutouts: "_outro-analysis/cards/"      # PNG с альфой (rembg isnet), относительно MIA_SHORT_DIR — без изменений
  freeze: {mixFrames: 2, punchIn: 0.03}  # NEW v4: кадр замирает через микс 2 кадра + лёгкий наезд 3 % в момент остановки (приём стоп-кадров «Большого куша»)
  bg:                                    # NEW v4: фон = сам замерший кадр сцены, а не плоская заливка
    source: cutoutSource                 # кадр, из которого вырезана фигура (MIA V5 f24, JAX V9 f168, HALE V12 f12; ROOK — cards/src/DARK_new2.jpg)
    mono: true                           # холодный монохром
    darken: 0.45
    blurPx: 6                            # при 1080p
    grid: {alpha: 0.06, stepPx: 48}      # тонкая сетка досье поверх фона
  hero: {color: true, outline: none}     # NEW v4: фигура из вырезки остаётся в цвете; белая/чёрная обводка v3 убирается
  scan: {durFrames: 10, dir: down, alpha: 0.35, glowPx: 2}   # NEW v4: одна линия сканирования сверху вниз за 10 кадров после фриза
  lock:                                  # NEW v4: тонкие уголки-рамки защёлкиваются на лице за 4 кадра
    target: face                         # лицо — по Vision (tools/matte, задача 025) на кадре-источнике вырезки
    snapFrames: 4
    strokePx: 3
    carryFrom: hand                      # NEW v4 (решение Олега 2026-11-06, 030 этап В): в последних 4 кадрах V10:150 лица ROOK нет (Vision: 0 лиц) — lockCarry стартует с рамки кисти с пистолетом (Vision hand pose)
  label: {format: "SUBJECT {nn} · {NAME} · {TAGLINE}", font: JetBrainsMono, typeOn: true, charFrames: 0.3333, heightFrac: 0.022}   # charFrames 1 → 0.3333 (3 символа за кадр): решение Олега 2026-11-06, 030 этап В — при 1 строка в 31–35 символов не допечатывается за 33 кадра карточки   # NEW v4: печатается после защёлкивания; nn: MIA 01, ROOK 02, JAX 03, HALE 04
  name: {font: Anton, behindFigure: false, heightFrac: 0.42}   # behindFigure true → false (2026-11-06, после чернового рендера: в 16:9 крупные планы закрывали 47–78 % букв имени, readcheck OCCLUDED; Олег: «смысл аутро — имена и вопросы героев должны читаться, как в v3»). Имя — перед фигурой, на свободной от лица стороне; параллакс сохранён
  tagline: {font: Oswald, heightFrac: 0.055}   # 2026-11-06 (тот же разбор): подпись героя («The Inventor», «Friend or enemy?») снова крупно под именем на плашке, как в v3; в label остаётся служебной строкой
  accent: {MIA: "#D62828", DARK: "#F7C600", BLOND: "#00AAC8", OFFICER: "#F7C600"}   # NEW v4: цвет героя (из bg v3) — только уголки рамок, линия скана и подчёркивание label
  depth: {figure: 1.0, name: 0.6, bg: 0.3, push: 0.04}   # NEW v4: параллакс трёх слоёв при наезде 4 % за длительность карточки
  font: {name: Anton, tagline: Oswald, label: JetBrainsMono}   # все в public/fonts
  # убрано из v3: outline, bg.halftone, bg.rays, concept (поп-арт)
prepare:        # NEW v4
  upscale: {DARK: {tool: realesrgan-ncnn-vulkan, model: realesrgan-x4plus-anime, scale: 4, note: "ROOK мягче остальных (640×503 ×2.5); локально, замерить пик памяти; результат — новая вырезка рядом, старая не удаляется"}}

episodes:
  ep01:
    # Каждый пункт начинается на доле; `on: hN` — на ударе N из music.hits; `beats` — длительность в долях.
    timeline:
      # Каждый пункт начинается на доле; `on: hN` — удар N из music.hits; `beats` — длительность в долях; `in` — приём входа (см. fx).
      - {kind: live, src: V7,  from: 24,  to: 45,  on: start, beats: 2, note: "погоня: Subaru и BMW на трассе"}
      - {kind: live, src: V1,  from: 180, to: 201, on: h1, beats: 2, in: whip, note: "капот Subaru, MIA за стеклом, BMW сзади"}
      - {kind: live, src: V3,  from: 228, to: 260, beats: 2, in: whip, ramp: true, note: "машина переворачивается в воздухе; 33 исх. кадра в 22 вых. — speed ramp в замедление к удару"}
      - {kind: card, hero: MIA,   cutout: MIA_V5_f24_cut.png,    title: MIA,  tagline: "The Inventor",     bg: "#D62828", side: left,  on: h2, beats: 3}
      - {kind: live, src: V10, from: 97,  to: 108, beats: 1, in: cut, note: "ROOK смотрит на MIA (V10-02)"}
      - {kind: live, src: V10, from: 150, to: 193, on: h3, beats: 4, in: whip, ramp: true, note: "ROOK наводит пистолет на MIA; склейка ровно на удар; ramp + наезд к удару (как в прототипе)"}
      - {kind: card, hero: DARK,  cutout: DARK_new2_cut.png, title: ROOK, tagline: "The Hunter",       bg: "#F7C600", side: left,  on: h4, beats: 3, in: lockCarry, note: "NEW v4 in: lockCarry — уголки рамки появляются на лице ROOK в последних 4 кадрах живого V10:150 и переезжают на лицо карточки (склейка по форме, «один сквозной актёр»). Кадр 2 Олега (прямой взгляд в камеру, src: cards/src/DARK_new2.jpg — отдельная картинка, не из видео); f221 отклонён 2026-10-18 — читается как удивление, удивление только у JAX. Подчистить: кусок руки MIA у правого края вырезки"}
      - {kind: live, src: V9,  from: 157, to: 168, beats: 1, in: whip, ramp: true}
      - {kind: card, hero: BLOND, cutout: BLOND_V9_f168_cut.png, title: JAX,  tagline: "Friend or enemy?", bg: "#00AAC8", side: right, on: h5, beats: 3}
      - {kind: live, src: V12, from: 1,   to: 12,  beats: 1, in: cut, ramp: true, note: "HALE профиль с гарнитурой"}
      - {kind: card, hero: OFFICER, cutout: OFF_V12_f12_cut.png, title: HALE, tagline: "The Law",          bg: "#1E1E1E", tagColor: "#F7C600", side: right, on: h6, beats: 4}
      - {kind: live, src: V12, from: 317, to: 360, on: h7, beats: 4, in: whip, note: "заряд на двери, мигает красный огонёк; медленный наезд на огонёк"}
      - {kind: lull, src: V5,  from: 239, on: h8, beats: 4, push: 0.04, note: "закрытая железная дверь ангара; к концу — лёгкая вибрация кадра (предчувствие взрыва)"}
      - {kind: final, src: V5, on: h9, flash: true, in: lightMatch, alive: {push: 0.05, titleGrow: [1.0, 1.15], lineHeightFrac: 0.045, tailStamp: lastBeat}, title: MIA, line: "She built the future. They came to take it.", tail: "To be continued", note: "NEW v4 in: lightMatch — красный огонёк заряда (V12:317) в последней доле разрастается кругом и переходит во вспышку взрыва; alive: наезд 5 % за финал, MIA растёт 1.0→1.15, строка ≥ 4.5 % высоты, «To be continued» штампом на последней доле (STAMP из src/fx). v3: удар = взрыв: 3 белых кадра, сильная тряска, MIA влетает как имя на карточке; строка и tail крупнее; после обрыва музыки — holdAfter"}
    vertical:
      crops: {V7: B, V1: B, V3: A, V10_look: A, V10_gun: B, V9: A, V12_profile: A, V12_charge: C, V5_lull: C, V5_final: C}   # по листу MiaOutroVertical-crops.png (рекомендация архитектора, «всё да» Олега); для V7/V1/V3 вариантов ещё нет — билдер делает 3 варианта, по умолчанию B (центр действия), выбор Олега по листу
      cards: "фигура снизу, имя сверху ЗА фигурой (behindFigure), label над головой; растворение верха фигуры 120 px как в v3"
    sfx:                       # NEW v4: «каждый звук обоснован» — у каждого события: что видно в кадре (why.see), место под музыкой (why.mix), почему не перекрывает следующее (why.gap). Нет одного из трёх — звука нет.
      # Практика (EFFECTS_PANTRY §M/разбор 2026-11-06): сила в контрасте, а не в громкости; ≤ 3–5 слоёв одновременно; звук только на видимое действие; перед большим моментом — убрать, а не добавить.
      # v3: 14 событий (3 whip, 2 riser, 4 boom, 4 slam, 1 final). v4: 9 событий.
      events:
        - {id: whip-flip,  sound: whip,  at: "V3:228",  why: {see: "переворот машины — самое резкое движение камеры", mix: "−8 дБ к музыке, HPF 100 Гц", gap: "кончается до карточки MIA (удар h2)"}}
        - {id: whip-gun,   sound: whip,  at: "V10:150", why: {see: "ROOK резко наводит пистолет", mix: "−8 дБ, HPF 100 Гц", gap: "хвост ≤ 0.35 с, до lockCarry"}}
        - {id: freeze-x4,  sound: freeze, at: "card.freeze", heroes: [MIA, DARK, BLOND, OFFICER], why: {see: "кадр замер — звук остановки кадра, а не взрыв", mix: "короткий сухой срез/затвор, −6 дБ, без низа", gap: "≤ 0.15 с, не наползает на label"}}
        - {id: lock-tick,  sound: tick,  at: "card.lock", heroes: [MIA, DARK, BLOND, OFFICER], why: {see: "рамка защёлкнулась на лице", mix: "−14 дБ, тихий UI-тик (CC0 из 027 или mgaudio 022)", gap: "одиночный, 1 на карточку"}}
        - {id: riser-hale, sound: riser, at: "card:OFFICER", why: {see: "подвод к главному антагонисту-закону", mix: "−10 дБ, кончается на фризе HALE", gap: "один на ролик"}}
        - {id: drop-final, sound: silence, at: "h9 − 0.4 с", why: {see: "огонёк растёт — пауза перед взрывом", mix: "SFX 0, музыка −6 дБ на 0.4 с", gap: "контраст перед единственным громким местом"}}
        - {id: blast,      sound: final, at: "h9", why: {see: "взрыв двери, вспышка", mix: "единственный громкий звук ролика; после него музыка −3 дБ на 1 долю", gap: "хвост обрезать до hold"}}
      # Убрано из v3: boom на 4 карточках (нет видимого удара — фриз), riser перед ROOK, slam на посадке имени (имя за фигурой появляется без удара).
      sources: {whip: "sfx/raw/external/whoosh [need-02, hook-03]", freeze: "remotion__shutter-modern или CC0 из 027", tick: "CC0 UI (027) / mgaudio (022)", riser: "sfx/raw/external/riser [epic4-06]", final: "sfx/raw/external/boom [epic4-08]"}
      mix: {tailTrim: "каждый хвост обрезается fade 60 мс до начала следующего события", hpfHz: 100, limiter: {ceilingDbtp: -1.0, beforeLoudnorm: true}, target: {lufs: -14, tp: -1}}   # NEW v4
      license: "внешние (whoosh/riser/boom) — unknown → licenseWarning (гейт 6); замена на CC0 до публикации"
forbidden:   # дублирует shots.json для проверки сборки; источник правды — shots.json
  - {src: V8,  from: 0,     to: end,    reason: spoiler-flashback}
  - {src: V9,  from: 12.25, to: end,    reason: spoiler-flashback}
  - {src: V10, from: 0,     to: 2.33,   reason: "morph + spoiler-flashback"}
  - {src: V10, from: 8.13,  to: 9.458,  reason: "spoiler-flashback — только кроп без BLOND"}
  - {src: V10, from: 9.458, to: end,    reason: spoiler}
  - {src: V12, from: 3.0,   to: 8.5,    reason: "вшитый титр MIA'S STORY — a short film"}
